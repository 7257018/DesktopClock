name: Build and Release EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write  # 【补充】赋予发布 Release 的写入权限

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      - name: Install dependencies and Build EXE
        run: |
          pip install "PyQt6>=6.5.0"
          pip install "pyinstaller>=6.0"
          pyinstaller --onefile --windowed --name DesktopClock --clean --noconfirm --icon=icon.ico clock.py

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.sha }}
          name: Auto Build ${{ github.sha }}
          files: dist/DesktopClock.exe
          generate_release_notes: true
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}